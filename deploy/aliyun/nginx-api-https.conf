# Production API. Issue the certificate before enabling this configuration.
# Enable either this file or nginx-api-http.conf, never both.
upstream douyu_backend {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    server_name api.tpejocq.cn;
    server_tokens off;
    return 308 https://api.tpejocq.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name api.tpejocq.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.tpejocq.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tpejocq.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DouyuTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/douyu-api.access.log;
    error_log /var/log/nginx/douyu-api.error.log warn;
    client_max_body_size 12m;
    client_body_timeout 130s;
    send_timeout 130s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
    proxy_cache off;

    location ^~ /api/ {
        proxy_pass http://douyu_backend;
    }

    location ~ ^/health/(live|ready)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass http://douyu_backend;
    }

    location / {
        return 404;
    }
}
