# Temporary public HTTP API for invited experience debugging.
# Replace REPLACE_WITH_ECS_PUBLIC_IP with the verified ECS public IPv4 address.
# Enable only this site or another douyu API site; they share the upstream name.
# Use HTTPS for the normal production release.
upstream douyu_backend {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    server_name REPLACE_WITH_ECS_PUBLIC_IP;
    server_tokens off;

    access_log /var/log/nginx/douyu-api.access.log;
    error_log /var/log/nginx/douyu-api.error.log warn;
    client_max_body_size 12m;
    client_body_timeout 130s;
    send_timeout 130s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
    proxy_cache off;

    location ^~ /api/ {
        proxy_pass http://douyu_backend;
    }

    location ~ ^/health/(live|ready)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass http://douyu_backend;
    }

    location / {
        return 404;
    }
}
